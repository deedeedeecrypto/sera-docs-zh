<h1>Sera 中文开发文档</h1>
<p class="sub">官方文档只有英文，这里是补上的那一份。所有数据都实测过并标了日期。</p>
<a class="card" href="docs/quickstart.md"><b>快速开始</b><span>三分钟问到第一个跨币种报价，不用任何凭证</span></a>
<a class="card" href="docs/quote-api.md"><b>报价接口详解</b><span>公开文档里没有的 <code>/swap/quote</code> 完整请求格式</span></a>
<a class="card" href="docs/glossary.md"><b>术语表</b><span>中文里该怎么讲，翻译不对读者第一句就走了</span></a>
<a class="card" href="docs/troubleshooting.md"><b>常见错误</b><span>422、no_liquidity、报价返 0 分别是什么意思</span></a>
<p class="note"><code>POST /swap/quote</code> 是完全公开的接口，不用 key、不用注册、不用私钥。
但它的请求体格式没写在公开文档里，只存在于 <code>sera-mcp</code> 的类型定义中 ——
这就是这个仓库存在的原因。</p>
